          - "Set up a project": how-to/setup-project.md
          - "Run a full review": how-to/run-full-review.md
      - "Code review":
          - "Review code style": how-to/code/review-code-style.md
          - "Review test code": how-to/code/review-test-code.md
          - "Detect God classes": how-to/code/detect-god-classes.md
          - "Split a God test class": how-to/code/split-god-test-class.md
          - "Run an external review": how-to/code/run-external-review.md
      - "Python-specific":
