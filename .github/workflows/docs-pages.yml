---
name: Docs (Pages)

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel runs in progress.
concurrency:
  group: "docs-pages"
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  build-deploy:
    name: Build & deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs Material
        run: uv pip install "mkdocs-material==9.7.6"

      - name: Stage assets and rewrite links for site build
        # Source docs use relative paths that escape docs_dir (../assets/,
        # ../../README.md, etc.) — valid on GitHub, invalid in MkDocs. Rewrite
        # them in the staged copy only; source files stay untouched.
        run: |
          cp -r assets docs/assets
          python - <<'PY'
          import pathlib, re
          REPO = "https://github.com/Zolletta/zolletta-metaskill/blob/main"
          rewrites = [
              (r'\]\(\.\./assets/', '](assets/'),
              (r'\]\(\.\./\.\./README\.md\)', f']({REPO}/README.md)'),
              (r'\]\(\.\./\.\./setup/assets/settings\.schema\.json\)',
               f']({REPO}/setup/assets/settings.schema.json)'),
              (r'\]\(\.\./\.\./review/assets/summary_template\.md\)',
               f']({REPO}/review/assets/summary_template.md)'),
          ]
          for path in pathlib.Path("docs").rglob("*.md"):
              text = path.read_text()
              for pattern, replacement in rewrites:
                  text = re.sub(pattern, replacement, text)
              path.write_text(text)
          PY

      - name: Build site
        run: mkdocs build --clean --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
