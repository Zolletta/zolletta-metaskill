---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  UV_LOCK_TIMEOUT: 300

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "tests"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest --cov=zolletta_metaskill --cov-report=xml --cov-report=term -q

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  quality:
    name: ruff + ty + mypy + vulture
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "quality"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check

      - name: ty check
        run: uv run ty check .

      - name: mypy
        run: uv run mypy .

      - name: vulture
        run: uv run vulture .

  version-clash:
    name: Version clash check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for version clash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          THIS_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/')

          echo "This PR version: $THIS_VERSION"
          echo "Main version:     $MAIN_VERSION"

          if [ "$THIS_VERSION" = "$MAIN_VERSION" ]; then
            echo "No version bump in this PR — skipping clash check"
            exit 0
          fi

          echo "Version bumped: $MAIN_VERSION → $THIS_VERSION"

          CLASH=0
          for ref in $(gh pr list --json headRefName --jq '.[].headRefName'); do
            if [ "$ref" = "${{ github.head_ref }}" ]; then
              continue
            fi

            PR_VERSION=$(gh api "repos/$GITHUB_REPOSITORY/contents/pyproject.toml?ref=$ref" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null | \
              grep '^version = ' | head -1 | sed 's/version = "\(.*\)"/\1/') || true

            if [ -n "$PR_VERSION" ] && [ "$PR_VERSION" = "$THIS_VERSION" ]; then
              echo "::error::Version clash: PR on branch '$ref' also targets version $THIS_VERSION. Re-bump to a different version."
              CLASH=1
            fi
          done

          if [ "$CLASH" -eq 1 ]; then
            exit 1
          fi

          echo "No version clashes detected"
