name: Setup uv + Python + .venv
description: Install uv, set up Python, cache .venv, and sync dependencies. Reusable across all workflow jobs.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  cache-suffix:
    description: Suffix for the uv cache (isolates caches between jobs)
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        cache-suffix: ${{ inputs.cache-suffix }}

    - name: Cache .venv
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.cache-suffix }}-${{ hashFiles('uv.lock') }}

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: uv sync
