[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zolletta-metaskill"
version = "1.0.0"
description = "Generic code review skills with specializations for Python and other languages"
readme = "README.md"
license = { text = "MIT + Commons Clause" }
requires-python = ">=3.12"
authors = [{ name = "Zolletta" }]
keywords = ["code-review", "static-analysis", "solid", "design-patterns", "documentation-drift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.16.0",
    "mypy>=1.10",
    "ty>=0.0.65",
    "vulture>=2.10",
    "python-semantic-release>=9.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-php>=0.24.1",
]

[project.urls]
Homepage = "https://github.com/Zolletta/zolletta-metaskill"

[tool.hatch.build.targets.wheel]
packages = ["src/zolletta_metaskill"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "D", "UP", "T20", "SIM"]
ignore = ["B008", "T201", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D105", "B010"]

[tool.ruff.lint.isort]
known-first-party = ["zolletta_metaskill"]

[tool.mypy]
strict = true
python_version = "3.12"
python_executable = ".venv/bin/python"
mypy_path = "src"
exclude = ["zolletta-metaskill/"]

[[tool.mypy.overrides]]
module = ["tree_sitter.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=short"]
testpaths = ["tests"]
minversion = "8.0"
pythonpath = ["src"]

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = [".venv/"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_parser = "conventional"
commit_parser_options = { allowed_types = ["feat", "fix", "perf", "refactor"] }
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["chore.*", "docs.*"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
