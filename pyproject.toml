[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zolletta-metaskill"
version = "3.7.0"
description = "Generic code review skills with specializations for Python and other languages"
readme = "README.md"
license = { text = "MIT + Commons Clause" }
requires-python = ">=3.12"
authors = [{ name = "Zolletta" }]
keywords = ["code-review", "static-analysis", "solid", "design-patterns", "documentation-drift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.22.0",
]

[project.optional-dependencies]
# ADR-0004 §Decision. `tree-sitter-php` is optional for *consumers*: without it
# PHPEngine still imports and still satisfies the LanguageEngine protocol, and
# parse_module raises a clear ImportError with installation instructions.
#
# `tree-sitter` itself is a hard dependency. php_engine.py imports
# `from tree_sitter import Node, Parser, Tree` at module scope, so a missing
# tree-sitter would break the import rather than degrade gracefully — which is
# why ADR-0004 previously described both as optional and was wrong.
php = ["tree-sitter-php>=0.23.0"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.16.3",
    "mypy>=1.10",
    "ty>=0.0.72",
    "vulture>=2.10",
    "mutmut>=3.8.0",
    "python-semantic-release>=9.0",
    "gitpython>=3.1.59",
    # The PHP grammar is optional for consumers, but the dev group carries it so
    # `uv run pytest` exercises the PHP scanners instead of skipping all 41
    # tests guarded on `PHPEngine._have_tree_sitter_php()`.
    "tree-sitter-php>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/Zolletta/zolletta-metaskill"

[tool.hatch.build.targets.wheel]
packages = ["src/zolletta_metaskill"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Selected rule families:
#   E, W    — pycodestyle errors and warnings (whitespace, line length via E501, ...)
#   F       — pyflakes (unused imports/variables, undefined names, ...)
#   I       — isort (import sorting; see [tool.ruff.lint.isort])
#   B       — flake8-bugbear (likely bugs: mutable defaults, unused loop vars, ...)
#   C4      — flake8-comprehensions (unnecessary list/dict/set calls, ...)
#   D       — pydocstyle (docstring presence and formatting)
#   UP      — pyupgrade (modern syntax for target-version py312)
#   T20     — flake8-print (no print/pprint in library code)
#   SIM     — flake8-simplify (collapsible ifs, redundant code, ...)
#   N       — pep8-naming (N802: a test name must not embed a foreign-language
#             class spelling, e.g. test_built_in_stdClass)
#   TID     — flake8-tidy-imports (TID252: no relative imports — ADR-0015
#             promises `python3 <script>.py [--json]` runnable from the project
#             root with zero arguments, which a relative import makes impossible)#   PGH003  — blanket `# type: ignore` must name the ignored error code (issue #41)
#   PGH004  — blanket `# noqa` must name the ignored rule codes (issue #41)
select = ["E", "W", "F", "I", "B", "C4", "D", "UP", "T20", "SIM", "N", "TID", "PGH003", "PGH004"]

# Suppressed rules:
#   B008  — function call in default argument; Typer/argparse defaults legitimately
#           call functions (e.g. `Option(default_factory=...)`-style patterns)
#   T201  — `print` allowed: these files ARE the CLI entry points, stdout is the
#           interface (reporters/scanners print their reports)
#   D104  — missing docstring in `__init__.py`; package init files are empty
#   D107  — missing docstring in `__init__`; constructor docs live on the class
#   D203  — one blank line before class docstring (conflicts with D211, we keep D211)
#   D213  — multi-line docstring summary starts at second line (conflicts with D212,
#           we keep D212-style summaries on the first line)
ignore = ["B008", "T201", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.flake8-tidy-imports]
# "all", not ruff's default "parents".
#
# The default bans only `from ..pkg import x`; `from .sibling import x` still
# passes. That is exactly the import that broke ADR-0015's documented
# invocation — running link_checker.py or api_doc_validator.py directly aborted
# with "attempted relative import with no known parent package" — while the
# scanner reported all clear. "all" bans both forms, so the rule can no longer
# pass vacuously.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from docstring rules (D100 module / D101 class / D102 method /
# D103 function / D105 magic-method docstrings) and from B010 (setattr with a
# constant attribute name — used to poke internals under test).
#
# TID252 is exempt for a different reason. ADR-0015 constrains *scripts*:
# `python3 <script>.py [--json]` must work from the project root, and a relative
# import breaks that. Tests have no such requirement — pytest imports them as
# modules of a real package — and `from .conftest import ...` is the idiomatic
# way to reach a shared fixture. Exempting them keeps the rule pointed at the
# case it exists to prevent rather than at conventional pytest style.
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D105", "B010", "TID252"]

[tool.ruff.lint.isort]
known-first-party = ["zolletta_metaskill"]

[tool.mypy]
strict = true
python_version = "3.12"
python_executable = ".venv/bin/python"
mypy_path = "src"
exclude = ["zolletta-metaskill/", "playground/"]

[[tool.mypy.overrides]]
# Scoped to the optional grammar only (ADR-0004). `tree_sitter` itself is a hard
# dependency and must be typed normally: masking it would hide the one failure
# this project can actually hit, namely tree-sitter not being installed.
module = ["tree_sitter_php.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
addopts = ["-ra", "--tb=short"]
testpaths = ["tests"]
minversion = "8.0"
pythonpath = ["src"]
# An unclosed file or socket is a leak the suite should not tolerate silently.
filterwarnings = ["error::ResourceWarning"]

[tool.coverage.run]
# Branch coverage is the measurement the testing-style review reads; statement
# coverage hides an untaken branch behind a fully executed line.
branch = true

[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = [".venv/"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "uv build"
commit_parser = "conventional"
commit_parser_options = { allowed_types = ["feat", "fix", "perf", "refactor"] }
tag_format = "v{version}"
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["chore.*", "docs.*"]

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.ty.src]
# playground/ is intentionally defective scanner dogfooding input.
exclude = ["playground"]
